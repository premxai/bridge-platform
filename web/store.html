<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ShopCo — Everyday essentials</title>
<style>
  :root { --ink:#0a0a0a; --ink2:#404040; --muted:#737373; --line:#e5e5e5; --soft:#f5f5f4; --bg:#ffffff; --ok:#15803d; --okbg:#f0fdf4; --bad:#b91c1c; --badbg:#fef2f2; --info:#1d4ed8; --infobg:#eff6ff; --warnbg:#fffbeb; --warn:#92400e; }
  * { box-sizing:border-box; }
  html, body { margin:0; background:var(--bg); color:var(--ink); font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Inter, Roboto, "Helvetica Neue", Arial, sans-serif; -webkit-font-smoothing:antialiased; }
  a { color:inherit; text-decoration:none; }
  button { font:inherit; color:inherit; cursor:pointer; }
  img { display:block; max-width:100%; }
  .wrap { max-width:1280px; margin:0 auto; padding:0 24px; }
  @media (max-width:640px) { .wrap { padding:0 16px; } }

  .announce { background:var(--ink); color:#fff; text-align:center; font-size:13px; padding:9px 16px; letter-spacing:.01em; }
  header.site { position:sticky; top:0; z-index:20; background:rgba(255,255,255,.96); backdrop-filter:saturate(180%) blur(8px); border-bottom:1px solid var(--line); }
  .hbar { display:grid; grid-template-columns:1fr auto 1fr; align-items:center; height:64px; }
  .nav { display:flex; gap:24px; font-size:14px; } .nav a { color:var(--ink2); } .nav a:hover, .nav a.on { color:var(--ink); }
  .logo { font-weight:800; letter-spacing:.28em; font-size:18px; }
  .icons { display:flex; justify-content:flex-end; gap:6px; }
  .icon { width:40px; height:40px; border-radius:999px; border:0; background:transparent; display:inline-flex; align-items:center; justify-content:center; position:relative; }
  .icon:hover { background:var(--soft); }
  .icon svg { width:20px; height:20px; }
  .badge-count { position:absolute; top:4px; right:2px; background:var(--ink); color:#fff; font-size:10px; font-weight:700; min-width:17px; height:17px; border-radius:999px; display:flex; align-items:center; justify-content:center; padding:0 4px; }
  @media (max-width:820px) { .nav { display:none; } .hbar { grid-template-columns:auto 1fr auto; } .logo { justify-self:start; } }
  .mnav { display:none; gap:18px; overflow-x:auto; padding:10px 16px; border-top:1px solid var(--line); font-size:14px; white-space:nowrap; }
  @media (max-width:820px) { .mnav { display:flex; } }

  .hero { position:relative; height:min(78vh, 640px); overflow:hidden; }
  .hero img { width:100%; height:100%; object-fit:cover; filter:brightness(.72); }
  .hero .copy { position:absolute; inset:auto 0 0 0; padding:56px 0; color:#fff; }
  .hero h1 { font-size:clamp(36px, 6vw, 68px); line-height:1.02; margin:0 0 14px; letter-spacing:-.02em; font-weight:700; }
  .hero p { font-size:17px; max-width:460px; margin:0 0 24px; opacity:.92; }
  .btn { display:inline-flex; align-items:center; justify-content:center; gap:8px; height:48px; padding:0 26px; border-radius:999px; border:1px solid var(--ink); background:var(--ink); color:#fff; font-weight:600; font-size:15px; }
  .btn:hover { opacity:.88; }
  .btn.light { background:#fff; color:var(--ink); border-color:#fff; }
  .btn.ghost { background:#fff; color:var(--ink); border-color:var(--line); }
  .btn.block { width:100%; }
  .btn:disabled { opacity:.45; cursor:default; }
  section.block { padding:64px 0; }
  .sec-head { display:flex; align-items:end; justify-content:space-between; margin-bottom:24px; }
  .sec-head h2 { font-size:28px; margin:0; letter-spacing:-.01em; }
  .sec-head a { font-size:14px; text-decoration:underline; text-underline-offset:4px; }

  .grid { display:grid; grid-template-columns:repeat(4, 1fr); gap:28px 20px; }
  @media (max-width:1000px) { .grid { grid-template-columns:repeat(3, 1fr); } }
  @media (max-width:700px) { .grid { grid-template-columns:repeat(2, 1fr); gap:22px 12px; } }
  .card .ph { position:relative; aspect-ratio:1; background:var(--soft); border-radius:14px; overflow:hidden; }
  .card .ph > a { display:block; width:100%; height:100%; }
  .card .ph img { width:100%; height:100%; object-fit:cover; transition:transform .5s ease; }
  .card:hover .ph img { transform:scale(1.04); }
  .tag { position:absolute; top:12px; left:12px; background:#fff; color:var(--ink); font-size:11px; font-weight:700; letter-spacing:.04em; text-transform:uppercase; border-radius:999px; padding:5px 10px; }
  .quick { position:absolute; left:12px; right:12px; bottom:12px; opacity:0; transform:translateY(6px); transition:all .2s; }
  .card:hover .quick { opacity:1; transform:none; }
  @media (hover:none) { .quick { display:none; } }
  .card .meta { padding:12px 2px 0; }
  .card .name { font-size:15px; font-weight:500; }
  .card .row2 { display:flex; justify-content:space-between; color:var(--muted); font-size:14px; margin-top:4px; }
  .card .price { color:var(--ink); }

  .cats { display:grid; grid-template-columns:repeat(3, 1fr); gap:16px; }
  @media (max-width:700px) { .cats { grid-template-columns:1fr; } }
  .cat { display:block; position:relative; aspect-ratio:4/5; border-radius:16px; overflow:hidden; }
  .cat img { width:100%; height:100%; object-fit:cover; filter:brightness(.78); transition:transform .5s; }
  .cat:hover img { transform:scale(1.04); }
  .cat span { position:absolute; left:20px; bottom:20px; color:#fff; font-size:22px; font-weight:600; }
  @media (max-width:700px) { .cat { aspect-ratio:16/9; } }

  .values { display:grid; grid-template-columns:repeat(3, 1fr); border-top:1px solid var(--line); border-bottom:1px solid var(--line); }
  .values div { padding:28px 20px; text-align:center; font-size:14px; color:var(--ink2); } .values b { display:block; color:var(--ink); font-size:15px; margin-bottom:4px; }
  @media (max-width:700px) { .values { grid-template-columns:1fr; } }

  footer.site { background:var(--soft); margin-top:64px; padding:48px 0 28px; font-size:14px; color:var(--ink2); }
  .fcols { display:grid; grid-template-columns:2fr 1fr 1fr 1fr; gap:24px; }
  @media (max-width:700px) { .fcols { grid-template-columns:1fr 1fr; } }
  .fcols h4 { margin:0 0 12px; color:var(--ink); font-size:14px; } .fcols a { display:block; padding:4px 0; }
  .news { display:flex; gap:8px; margin-top:12px; } .news input { flex:1; height:44px; border:1px solid var(--line); border-radius:999px; padding:0 16px; font:inherit; background:#fff; }
  .legal { display:flex; justify-content:space-between; margin-top:36px; padding-top:20px; border-top:1px solid var(--line); font-size:12px; color:var(--muted); flex-wrap:wrap; gap:8px; }

  .crumbs { font-size:13px; color:var(--muted); padding:20px 0; } .crumbs a:hover { color:var(--ink); }
  .pdp { display:grid; grid-template-columns:1.15fr 1fr; gap:48px; padding-bottom:48px; }
  @media (max-width:860px) { .pdp { grid-template-columns:1fr; gap:24px; } }
  .pdp .ph { background:var(--soft); border-radius:18px; overflow:hidden; aspect-ratio:1; } .pdp .ph img { width:100%; height:100%; object-fit:cover; }
  .pdp h1 { font-size:32px; margin:0 0 8px; letter-spacing:-.01em; }
  .stars { color:var(--ink); font-size:14px; letter-spacing:1px; } .stars small { color:var(--muted); letter-spacing:0; margin-left:6px; }
  .pprice { font-size:22px; margin:14px 0 18px; }
  .lbl { font-size:13px; font-weight:600; margin:18px 0 10px; display:flex; justify-content:space-between; } .lbl span { font-weight:400; color:var(--muted); }
  .chips { display:flex; flex-wrap:wrap; gap:8px; }
  .chip { min-width:52px; height:44px; padding:0 16px; border:1px solid var(--line); border-radius:999px; background:#fff; font-size:14px; }
  .chip.on { border-color:var(--ink); background:var(--ink); color:#fff; }
  .qty { display:inline-flex; align-items:center; border:1px solid var(--line); border-radius:999px; height:48px; }
  .qty button { width:44px; height:100%; border:0; background:transparent; font-size:18px; } .qty span { min-width:28px; text-align:center; }
  .buyrow { display:flex; gap:10px; margin-top:22px; } .buyrow .btn { flex:1; }
  .perks { margin-top:18px; font-size:13px; color:var(--ink2); display:grid; gap:8px; }
  details.acc { border-top:1px solid var(--line); padding:16px 0; } details.acc:last-of-type { border-bottom:1px solid var(--line); }
  details.acc summary { cursor:pointer; font-weight:600; font-size:15px; list-style:none; display:flex; justify-content:space-between; } details.acc summary::after { content:"+"; } details.acc[open] summary::after { content:"−"; }
  details.acc ul { margin:12px 0 0; padding-left:18px; color:var(--ink2); font-size:14px; line-height:1.8; }
  .err { color:var(--bad); font-size:13px; margin-top:8px; min-height:18px; }

  .scrim { position:fixed; inset:0; background:rgba(0,0,0,.35); z-index:40; opacity:0; pointer-events:none; transition:opacity .2s; }
  .scrim.on { opacity:1; pointer-events:auto; }
  .drawer { position:fixed; top:0; right:0; bottom:0; width:min(440px, 100%); background:#fff; z-index:50; transform:translateX(100%); transition:transform .25s ease; display:flex; flex-direction:column; }
  .drawer.on { transform:none; }
  .dhead { display:flex; justify-content:space-between; align-items:center; padding:18px 20px; border-bottom:1px solid var(--line); font-weight:600; }
  .dbody { flex:1; overflow:auto; padding:8px 20px; }
  .dfoot { border-top:1px solid var(--line); padding:18px 20px; }
  .line { display:grid; grid-template-columns:76px 1fr auto; gap:14px; padding:16px 0; border-bottom:1px solid var(--line); align-items:start; }
  .line img { width:76px; height:76px; object-fit:cover; border-radius:10px; background:var(--soft); }
  .line .n { font-size:14px; font-weight:500; } .line .v { font-size:13px; color:var(--muted); margin-top:3px; }
  .line .qty { height:34px; margin-top:10px; } .line .qty button { width:32px; font-size:15px; }
  .link { font-size:13px; color:var(--muted); text-decoration:underline; text-underline-offset:3px; background:none; border:0; padding:0; }
  .tot { display:flex; justify-content:space-between; font-size:15px; margin-bottom:6px; }
  .small { font-size:13px; color:var(--muted); }
  .empty { text-align:center; padding:60px 0; color:var(--muted); }

  /* checkout */
  .cohead { border-bottom:1px solid var(--line); } .cohead .hbar { grid-template-columns:1fr auto; }
  .co { display:grid; grid-template-columns:1.2fr 1fr; min-height:calc(100vh - 65px); }
  @media (max-width:900px) { .co { grid-template-columns:1fr; } .co .side { order:-1; } }
  .co .main { padding:36px 48px 64px max(24px, calc((100vw - 1280px)/2 + 24px)); }
  .co .side { background:var(--soft); border-left:1px solid var(--line); padding:36px max(24px, calc((100vw - 1280px)/2 + 24px)) 36px 40px; }
  @media (max-width:900px) { .co .main, .co .side { padding:24px 16px; } .co .side { border-left:0; border-bottom:1px solid var(--line); } }
  .co h2 { font-size:19px; margin:30px 0 14px; display:flex; justify-content:space-between; align-items:center; } .co h2:first-child { margin-top:0; }
  .fld { position:relative; margin-bottom:12px; }
  .fld input, .fld select { width:100%; height:52px; border:1px solid #d4d4d4; border-radius:10px; padding:20px 14px 6px; font:inherit; font-size:15px; background:#fff; outline:none; appearance:none; }
  .fld select { padding-top:18px; }
  .fld label { position:absolute; left:15px; top:7px; font-size:11px; color:var(--muted); pointer-events:none; }
  .fld input:focus, .fld select:focus { border-color:var(--ink); box-shadow:0 0 0 1px var(--ink); }
  .fld.bad input, .fld.bad select { border-color:var(--bad); box-shadow:0 0 0 1px var(--bad); }
  .row { display:grid; grid-template-columns:1fr 1fr; gap:12px; } .row3 { display:grid; grid-template-columns:1fr 1fr 1fr; gap:12px; }
  @media (max-width:560px) { .row3 { grid-template-columns:1fr 1fr; } .row3 .fld:first-child { grid-column:1 / -1; } }
  .check { display:flex; gap:10px; align-items:center; font-size:14px; margin:6px 0 4px; }
  .opts { border:1px solid #d4d4d4; border-radius:12px; overflow:hidden; }
  .opt { display:flex; align-items:center; gap:12px; padding:16px; border-bottom:1px solid #d4d4d4; cursor:pointer; font-size:14px; }
  .opt:last-child { border-bottom:0; } .opt.on { background:#fafaf9; box-shadow:inset 0 0 0 1px var(--ink); }
  .opt .grow { flex:1; } .opt small { display:block; color:var(--muted); }
  .paybox { border:1px solid #d4d4d4; border-radius:12px; overflow:hidden; }
  .paytop { display:flex; justify-content:space-between; align-items:center; padding:14px 16px; background:#fafaf9; border-bottom:1px solid #d4d4d4; font-size:14px; font-weight:600; }
  .brands { display:flex; gap:6px; } .brand { font-size:10px; font-weight:800; border:1px solid var(--line); border-radius:4px; padding:3px 6px; background:#fff; letter-spacing:.04em; color:var(--ink2); } .brand.on { border-color:var(--ink); color:var(--ink); }
  .paybody { padding:16px; }
  .secure { display:flex; gap:8px; align-items:center; color:var(--muted); font-size:13px; margin-bottom:12px; }
  .notice { background:var(--warnbg); color:var(--warn); border-radius:10px; padding:10px 12px; font-size:13px; margin:4px 0 12px; }
  .powered { text-align:center; font-size:12px; color:var(--muted); margin-top:12px; }
  .sumline { display:grid; grid-template-columns:64px 1fr auto; gap:14px; align-items:center; padding:8px 0; font-size:14px; }
  .thumb { position:relative; } .thumb img { width:64px; height:64px; border-radius:10px; object-fit:cover; border:1px solid var(--line); background:#fff; }
  .thumb b { position:absolute; top:-8px; right:-8px; background:#737373; color:#fff; font-size:11px; min-width:20px; height:20px; border-radius:999px; display:flex; align-items:center; justify-content:center; }
  .disc { display:flex; gap:10px; margin:18px 0; } .disc .fld { flex:1; margin:0; } .disc .btn { height:52px; border-radius:10px; }
  .totals { border-top:1px solid var(--line); padding-top:14px; } .totals .tot { font-size:14px; } .grand { font-size:19px !important; font-weight:700; margin-top:10px; } .grand small { font-size:12px; color:var(--muted); font-weight:400; margin-right:6px; }

  .overlay { position:fixed; inset:0; background:rgba(255,255,255,.92); z-index:60; display:none; align-items:center; justify-content:center; flex-direction:column; gap:14px; text-align:center; }
  .overlay.on { display:flex; }
  .spin { width:44px; height:44px; border:3px solid var(--line); border-top-color:var(--ink); border-radius:50%; animation:spin .9s linear infinite; }
  @keyframes spin { to { transform:rotate(360deg); } }

  /* order page */
  .op { max-width:760px; margin:0 auto; padding:40px 24px 64px; }
  .ostat { border-radius:16px; padding:24px; margin-bottom:20px; display:flex; gap:16px; align-items:flex-start; }
  .ostat.ok { background:var(--okbg); } .ostat.bad { background:var(--badbg); } .ostat.info { background:var(--infobg); }
  .ostat .ic { width:40px; height:40px; border-radius:999px; flex:none; display:flex; align-items:center; justify-content:center; color:#fff; font-weight:800; }
  .ostat.ok .ic { background:var(--ok); } .ostat.bad .ic { background:var(--bad); } .ostat.info .ic { background:var(--info); }
  .ostat h1 { font-size:24px; margin:0 0 6px; letter-spacing:-.01em; } .ostat p { margin:0; color:var(--ink2); font-size:15px; line-height:1.5; }
  .box { border:1px solid var(--line); border-radius:16px; padding:20px; margin-bottom:16px; }
  .box h3 { margin:0 0 12px; font-size:16px; }
  .kv { display:grid; grid-template-columns:1fr 1fr; gap:16px; font-size:14px; } .kv small { display:block; color:var(--muted); margin-bottom:4px; }
  .timeline { position:relative; padding-left:22px; margin-top:6px; }
  .timeline:before { content:""; position:absolute; left:6px; top:6px; bottom:6px; width:2px; background:var(--line); }
  .tl { position:relative; padding:6px 0 10px; font-size:14px; } .tl:before { content:""; position:absolute; left:-21px; top:11px; width:10px; height:10px; border-radius:50%; background:var(--info); }
  .tl small { display:block; color:var(--muted); font-size:12px; margin-top:2px; }
  .pulse { display:inline-block; width:8px; height:8px; border-radius:50%; background:var(--info); margin-right:8px; animation:p 1.2s infinite; vertical-align:middle; }
  @keyframes p { 50% { opacity:.25; } }
  .pill { font-size:12px; font-weight:600; border-radius:999px; padding:4px 10px; white-space:nowrap; }
  .pill.paid { background:var(--okbg); color:var(--ok); } .pill.failed { background:var(--badbg); color:var(--bad); } .pill.rec { background:var(--infobg); color:var(--info); }
  .olist a { display:flex; justify-content:space-between; align-items:center; padding:16px 0; border-bottom:1px solid var(--line); gap:12px; }
  .toast { position:fixed; left:50%; bottom:24px; transform:translateX(-50%) translateY(20px); background:var(--ink); color:#fff; padding:12px 18px; border-radius:999px; font-size:14px; opacity:0; transition:all .25s; z-index:70; }
  .toast.on { opacity:1; transform:translateX(-50%); }
</style>
</head>
<body>
<div id="root"></div>
<div class="scrim" id="scrim"></div>
<aside class="drawer" id="drawer" aria-label="Shopping bag"></aside>
<div class="overlay" id="overlay"><div class="spin"></div><b id="ovTitle">Processing payment…</b><div class="small" id="ovSub">Please don't close this page.</div></div>
<div class="toast" id="toast"></div>

<script>
const $ = (s, el = document) => el.querySelector(s);
const $$ = (s, el = document) => [...el.querySelectorAll(s)];
const money = (n) => "$" + Number(n).toFixed(2);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const store = { get(k, d) { try { return JSON.parse(localStorage.getItem(k)) ?? d; } catch { return d; } }, set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} } };
const api = (p, body) => fetch(p, body ? { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify(body) } : {}).then((r) => r.json());

let shopper = store.get("shopper", null);
if (!shopper) { shopper = Math.random().toString(36).slice(2, 10); store.set("shopper", shopper); }
let bag = store.get("bag", []);
let products = [];
let timers = [];
const TAX = 0.08625;
const find = (id) => products.find((p) => p.id === id);
const img = (p) => `/img/${p.image}`;
const saveBag = () => { store.set("bag", bag); $$(".badge-count").forEach((b) => { const n = bag.reduce((s, i) => s + i.qty, 0); b.textContent = n; b.style.display = n ? "" : "none"; }); };
const subtotal = () => Math.round(bag.reduce((s, i) => s + find(i.product_id).price * i.qty, 0) * 100) / 100;
const variant = (i) => [i.color, i.size].filter(Boolean).join(" / ");
function toast(t) { const el = $("#toast"); el.textContent = t; el.classList.add("on"); setTimeout(() => el.classList.remove("on"), 1800); }
const ICON = {
  search: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>',
  user: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="8" r="4"/><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"/></svg>',
  bag: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M6 7h12l1 14H5L6 7Z"/><path d="M9 7a3 3 0 0 1 6 0"/></svg>',
  lock: '<svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>',
};
const CATS = ["Apparel", "Accessories", "Bags", "Home", "Coffee", "Audio"];

function shell(inner, active = "") {
  return `
  <div class="announce">Free standard shipping on orders over $75 · Free 30-day returns</div>
  <header class="site"><div class="wrap hbar">
    <nav class="nav"><a href="#/shop" class="${active === "all" ? "on" : ""}">Shop all</a>${CATS.slice(0, 4).map((c) => `<a href="#/shop/${c}" class="${active === c ? "on" : ""}">${c}</a>`).join("")}</nav>
    <a class="logo" href="#/">SHOPCO</a>
    <div class="icons">
      <a class="icon" href="#/shop" aria-label="Search">${ICON.search}</a>
      <a class="icon" href="#/account" aria-label="Account">${ICON.user}</a>
      <button class="icon" id="bagBtn" aria-label="Bag">${ICON.bag}<span class="badge-count"></span></button>
    </div>
  </div>
  <nav class="mnav"><a href="#/shop">Shop all</a>${CATS.map((c) => `<a href="#/shop/${c}">${c}</a>`).join("")}<a href="#/account">Orders</a></nav>
  </header>
  <main>${inner}</main>
  <footer class="site"><div class="wrap">
    <div class="fcols">
      <div><div class="logo" style="font-size:16px">SHOPCO</div><p style="max-width:320px">Thoughtfully made everyday essentials. Designed in San Francisco.</p>
        <div class="news"><input placeholder="Email address" aria-label="Email for newsletter"><button class="btn" style="height:44px" onclick="toast('Thanks for subscribing!')">Subscribe</button></div></div>

function validate() {
  const v = (id) => ($("#" + id)?.value ?? "").trim();
  const bad = [];
  if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(v("email"))) bad.push(["email", "Enter a valid email"]);
  for (const k of ["first_name", "last_name", "address1", "city"]) if (!v(k)) bad.push([k, "Required"]);
  if (!v("state")) bad.push(["state", "Select a state"]);
  if (!/^\d{5}$/.test(v("zip"))) bad.push(["zip", "Enter a 5-digit ZIP code"]);
  if (!luhn(v("cardnum"))) bad.push(["cardnum", "Enter a valid card number"]);
  const m = v("exp").match(/^(\d{2}) \/ (\d{2})$/);
  if (!m || +m[1] < 1 || +m[1] > 12 || new Date(2000 + +m[2], +m[1]) < new Date()) bad.push(["exp", "Enter a valid expiration date"]);
  if (!/^\d{3,4}$/.test(v("cvc"))) bad.push(["cvc", "Enter the security code"]);
  if (!v("cardname")) bad.push(["cardname", "Enter the name on your card"]);
  $$(".fld").forEach((f) => f.classList.toggle("bad", bad.some(([k]) => k === f.dataset.f)));
  $("#coerr").textContent = bad.length ? `Please check: ${[...new Set(bad.map(([, m]) => m))].join(", ")}.` : "";
  if (bad.length) $(`[data-f="${bad[0][0]}"]`)?.scrollIntoView({ behavior: "smooth", block: "center" });
  return !bad.length;
}

    $("main").innerHTML = `<div class="op"><h1 style="font-size:28px;margin:0 0 6px">Your orders</h1><p class="small" style="margin:0 0 20px">Orders placed from this device.</p>
      <div class="box olist" style="padding:4px 20px">${list.length ? list.map((o) => `<a href="#/order/${o.order_id}"><div><b>${esc(o.order_id)}</b><div class="small">${(o.items || []).map((i) => esc(i.name)).join(", ")} · ${new Date(o.created_at).toLocaleString()}</div></div>
        <div style="text-align:right"><div>${money(o.amount)}</div><span class="pill ${o.status}">${o.status === "paid" ? "Confirmed" : o.status === "failed" ? "Payment declined" : esc(o.status)}</span></div></a>`).join("") : `<div class="empty">No orders yet.</div>`}</div></div>`;
  }
  await draw();
  timers.push(setInterval(draw, 3000));
}

// ---------- router ----------
function route() {
  timers.forEach(clearInterval); timers = [];
  closeBag();
  const [, page, a] = (location.hash || "#/").split("/").map(decodeURIComponent);
  let html;
  if (page === "checkout") html = checkout();
  else if (page === "p") html = pdp(a);
  else if (page === "shop") html = shop(a);
  else if (page === "order") html = orderShell(`<div class="box">Loading your order…</div>`);
  else if (page === "account") html = orderShell(`<div class="box">Loading…</div>`);
  else html = home();
  $("#root").innerHTML = html;
  window.scrollTo(0, 0);
  saveBag();
  $("#bagBtn")?.addEventListener("click", openBag);
  bindCards(document);
  if (page === "p") bindPdp(a);
  if (page === "checkout" && bag.length) bindCheckout();
  if (page === "order") orderPage(a);
  if (page === "account") accountPage();
}
window.addEventListener("hashchange", route);
api("/api/products").then((p) => { products = p; bag = bag.filter((i) => find(i.product_id)); route(); });
</script>
</body>
</html>
